; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit: https://docs.platformio.org/page/projectconf.html
;
; One Teensy per hemisphere, each its own USB-MIDI device. Only one board is
; plugged in at a time for flashing. Flash the right hemisphere with:
;   pio run -e right -t upload
; and the left with:
;   pio run -e left -t upload
;
; Each build presents a fixed USB name ("Jaiba Right" / "Jaiba Left") so the
; sampler can auto-detect both boards without storing port ids.

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

[env:right]
; U_R — 9 dual-layer pads, all 18 analog pins used.
; JAIBA_HEMI_R selects the PCB pin map in src/main.cpp; a build without a
; hemisphere flag fails on purpose instead of using the old breadboard order.
build_flags = -D USB_MIDI_SERIAL -D JAIBA_HEMI_R

[env:left]
; U_L — 7 dual-layer pads (J_L0..J_L6). Loop/mux pads not implemented yet.
build_flags = -D USB_MIDI_SERIAL -D JAIBA_HEMI_L
; Let PlatformIO auto-detect the port. A hard-coded `upload_port = COM3` is a
; Windows-only name and silently breaks `pio run -t upload` on Linux, where the
; board is usually /dev/ttyACM0. Override per-invocation with:
;   pio run -e right -t upload --upload-port /dev/ttyACM0
; upload_port = COM3
